<head>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');

    /* Estilo base */
    body {
        font-family: 'Inter', sans-serif;
        background: url('logo-flor.png') center center no-repeat;
        background-size: 400px;
        background-attachment: fixed;
        color: #1e293b;
        margin: 0;
    }

    .container {
        max-width: 1000px;
        margin: auto;
        padding: 2rem;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Tarjetas con efecto hover */
    .card {
        background-color: white;
        padding: 2rem;
        border-radius: 1.5rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        width: 100%;
        margin-top: 1.5rem;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
    }

    /* Botones más llamativos */
    .btn {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: white;
        padding: 0.85rem 1.75rem;
        border-radius: 0.75rem;
        font-weight: 600;
        border: none;
        cursor: pointer;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        transition: all 0.25s ease;
    }
    .btn:hover {
        transform: translateY(-3px) scale(1.03);
        background: linear-gradient(135deg, #2563eb, #1e40af);
        box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4);
    }
    .btn:active {
        transform: translateY(0) scale(0.98);
    }

    /* Resultados con animación sutil */
    .result-item {
        background-color: #919ba5;
        padding: 1rem;
        border-radius: 0.75rem;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-bottom: 0.75rem;
        border: 1px solid #6181aa;
    }
    .result-item:hover {
        background-color: #1e84c8;
        border-color: #1a8dbe;
    }

    /* Modal */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(18, 83, 186, 0.6);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        animation: fadeIn 0.3s ease;
    }
    .modal-content {
        background-color: white;
        padding: 2rem;
        border-radius: 1.25rem;
        width: 90%;
        max-width: 550px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        animation: scaleUp 3.0s ease;
    }

    /* Animaciones */
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes scaleUp {
        from { transform: scale(0.9); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    /* Logo con degradado */
    .logo-gradient {
        /* Aplica un degradado sobre el logo usando mezcla de colores */
        /* Si el logo es PNG con transparencia, esto funciona bien */
        /* Si es JPG, se recomienda usar PNG para mejor efecto */
        position: relative;
        z-index: 1;
    }
    .logo-gradient::after {
        content: "";
        position: absolute;
        left: 0; top: 0; right: 0; bottom: 0;
        z-index: 2;
        pointer-events: none;
        border-radius: 1rem;
        background: linear-gradient(90deg, #3b82f6 0%, #60a5fa 50%, #2563eb 100%);
        opacity: 0.25;
        mix-blend-mode: multiply;
    }
</style>

</head>

        function renderZoneButtons() {
            const zones = [...new Set(data.map(item => item["ZONA "]).filter(z => z && z.toUpperCase() !== "IIT"))];
            console.log("Zonas encontradas:", zones); // Debug
            zoneButtons.innerHTML = '';
            
            if (zones.length === 0) {
                zoneButtons.innerHTML = '<p class="text-red-600 col-span-4 text-center">Error: No se encontraron zonas en los datos</p>';
                return;
            }
            
            zones.forEach(zone => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = zone;
                btn.onclick = () => showSearchResults(zone);
                zoneButtons.appendChild(btn);
            });
        }

        function showSearchResults(zone) {
            selectedZone = zone;
            zoneView.classList.add('hidden');
            searchView.classList.remove('hidden');
            searchInput.value = '';
            resultsList.innerHTML = '';
        }

        function goBackToZones() {
            selectedZone = null;
            searchInput.value = '';
            resultsList.innerHTML = '';
            searchView.classList.add('hidden');
            zoneView.classList.remove('hidden');
        }

        backButton.onclick = goBackToZones;

        function filterResults() {
            const query = searchInput.value.toLowerCase().trim();
            resultsList.innerHTML = '';
            if (query === '') return;
            const filteredData = data.filter(item => 
                item["ZONA "] === selectedZone && 
                item["TIPO DE NOVEDAD buscador"].toLowerCase().includes(query)
            );
            const novedades = [...new Set(filteredData.map(item => item["TIPO DE NOVEDAD buscador"]))];
            renderNovedadButtons(novedades);
        }

        function renderNovedadButtons(novedades) {
            resultsList.innerHTML = '';
            if (novedades.length === 0) {
                resultsList.innerHTML = '<p class="text-center text-gray-500">No se encontraron resultados.</p>';
                return;
            }
            novedades.forEach(novedad => {
                const li = document.createElement('div');
                li.className = 'result-item';
                li.innerHTML = `<p class="font-medium text-lg text-blue-800">${novedad}</p>`;
                li.onclick = () => showSubNovedas(novedad);
                resultsList.appendChild(li);
            });
        }

        function showSubNovedas(novedad) {
            resultsList.innerHTML = '';
            const subNovedades = data.filter(item => item["ZONA "] === selectedZone && item["TIPO DE NOVEDAD buscador"] === novedad);
            const backBtn = document.createElement('button');
            backBtn.className = 'mb-4 text-blue-600 font-medium hover:underline flex items-center';
            backBtn.innerHTML = `← Volver a la búsqueda`;
            backBtn.onclick = () => { resultsList.innerHTML = ''; filterResults(); };
            resultsList.appendChild(backBtn);
            subNovedades.forEach(item => {
                const li = document.createElement('div');
                li.className = 'result-item';
                li.innerHTML = `<p class="font-medium text-lg text-gray-800">${item["SUB NOVEDAD "]}</p>`;
                li.onclick = () => showDetails(item);
                resultsList.appendChild(li);
            });
        }

        function redactStepText(step) {
            if (typeof step !== 'string') return step;

            let text = step.trim();
            if (!text) return text;

            const match = text.match(/^(\*|\d+\.)\s*/);
            const prefix = match ? match[1] : '';
            let body = match ? text.slice(match[0].length) : text;

            const replacements = [
                [/\bcaracteristicas\b/gi, 'características'],
                [/\bccv\b/gi, 'CCTV'],
                [/\bponal\b/gi, 'Policía Nacional'],
                [/\baprension\b/gi, 'aprehensión'],
                [/\bidentificacion\b/gi, 'identificación'],
                [/\bactivacion\b/gi, 'activación'],
                [/\batencion\b/gi, 'atención'],
                [/\btencion\b/gi, 'atención'],
                [/\bvaloracion\b/gi, 'valoración'],
                [/\bpolicia nacional\b/gi, 'Policía Nacional'],
                [/\blinea\b/gi, 'línea'],
                [/\baisla\b/gi, 'aísla'],
                [/\bsotano\b/gi, 'sótano'],
                [/\bsituacion\b/gi, 'situación'],
                [/\bllamdo\b/gi, 'llamado'],
                [/\banfitrion\b/gi, 'anfitrión'],
                [/\bcodigos\b/gi, 'códigos'],
                [/\badministracion\b/gi, 'administración'],
                [/\binfoma\b/gi, 'informa'],
                [/\bpondra\b/gi, 'pondrá'],
                [/\bprohibicion\b/gi, 'prohibición'],
                [/\brepresentate\b/gi, 'representante'],
                [/\bdireccion\b/gi, 'dirección'],
                [/\btrancurridos\b/gi, 'transcurridos'],
                [/\btransfercias\b/gi, 'transferencias'],
                [/\bdebera\b/gi, 'deberá'],
                [/\bdeberan\b/gi, 'deberán'],
                [/\btecnico\b/gi, 'técnico'],
                [/\belectrico\b/gi, 'eléctrico'],
                [/\belectricos\b/gi, 'eléctricos'],
                [/\belectricas\b/gi, 'eléctricas'],
                [/\belectrica\b/gi, 'eléctrica'],
                [/\boperacion\b/gi, 'operación'],
                [/\binspeccion\b/gi, 'inspección'],
                [/\bconexion\b/gi, 'conexión'],
                [/\bverificacion\b/gi, 'verificación'],
                [/\bsubestacion\b/gi, 'subestación'],
                [/\bcritico\b/gi, 'crítico'],
                [/\bsolucion\b/gi, 'solución'],
                [/\bminimo\b/gi, 'mínimo'],
                [/\bmaximo\b/gi, 'máximo'],
                [/\brapida\b/gi, 'rápida'],
                [/\bantelacion\b/gi, 'antelación'],
                [/\btecnicos\b/gi, 'técnicos'],
                [/\bliberacion\b/gi, 'liberación'],
                [/\balmenos\b/gi, 'al menos'],
                [/\bhalla\b/gi, 'haya'],
                [/\bencontrase\b/gi, 'encontrarse']
            ];

            replacements.forEach(([pattern, value]) => {
                body = body.replace(pattern, value);
            });

            body = body
                .replace(/^se debe\s+/i, 'Se debe ')
                .replace(/^se deberá\s+/i, 'Se deberá ')
                .replace(/^debe\s+/i, 'Debe ')
                .replace(/^en caso de\s+/i, 'En caso de ');

            body = body
                .replace(/\s+/g, ' ')
                .replace(/\s+([,.;:])/g, '$1')
                .replace(/\(\s+/g, '(')
                .replace(/\s+\)/g, ')')
                .trim();

            if (body.length > 0) {
                body = body.charAt(0).toUpperCase() + body.slice(1);
                if (!/[.;:]$/.test(body)) {
                    body += '.';
                }
            }

            return prefix ? `${prefix} ${body}` : body;
        }

        function showDetails(item) {
            modalTitle.textContent = item["TIPO DE NOVEDAD buscador"];
            modalSubnovedad.textContent = `Sub-novedad: ${item["SUB NOVEDAD "]}`;
            const pasos = generateSteps(item["ZONA "], item["TIPO DE NOVEDAD buscador"], item["SUB NOVEDAD "]).map(redactStepText);
            pasosList.innerHTML = '';
            const pasosGenerales = [
                "Evaluar la situación.",
                "Notificar al personal responsable.",
                "Aislar la zona.",
                "Documentar lo ocurrido.",
                "Seguir protocolos establecidos."
            ];
            pasos.forEach((paso, idx) => {
                const li = document.createElement('li');
                li.style.animation = 'fadeInStep 0.5s ease both';
                li.style.animationDelay = `${idx * 0.07}s`;
                let colorClass = pasosGenerales.includes(paso)
                    ? 'text-yellow-600'
                    : 'text-gray-900';
                li.className = `transition-all duration-300 shadow-sm border border-gray-200 mb-1 px-4 py-2 rounded-lg flex items-center ${colorClass}`;
                li.innerHTML = `${paso}`;
                pasosList.appendChild(li);
            });
            modal.classList.remove('hidden');
        }

            modal.classList.add('hidden');
